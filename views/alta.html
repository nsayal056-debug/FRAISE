<!-- HERO -->

        <section class="hero-alta">

            <div class="hero-alta-overlay">

                <div class="hero-alta-content">

                    <h1>
                        Alta de Productos
                    </h1>

                    <p>
                        Agregá nuevos productos al catálogo de FRAISE ✨
                    </p>

                </div>

            </div>

        </section>

        <!-- FORMULARIO -->

        <section class="alta-section">

            <div class="alta-container">

                <div class="alta-info">

                    <h2>
                        Nuevo producto
                    </h2>

                    <p>
                        Completá todos los campos para registrar correctamente un nuevo producto dentro del catálogo de la pastelería. Las validaciones se muestran al salir de cada campo y antes de enviar.
                    </p>

                </div>

                <!-- FORM -->

                <div class="alta-formulario">

                    <form id="form-alta" novalidate>

                        <!-- NOMBRE -->

                        <div class="form-group">

                            <label for="nombre">
                                Nombre del producto
                            </label>

                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                required
                                minlength="3"
                                maxlength="40"
                                placeholder="Nombre del producto">
                        </div>

                        <!-- PRECIO -->

                        <div class="form-group">

                            <label for="precio">
                                Precio
                            </label>

                            <input
                                type="number"
                                id="precio"
                                name="precio"
                                required
                                min="1"
                                max="999999"
                                placeholder="$">
                        </div>

                        <!-- STOCK -->

                        <div class="form-group">

                            <label for="stock">
                                Stock disponible
                            </label>

                            <input
                                type="number"
                                id="stock"
                                name="stock"
                                required
                                min="0"
                                max="9999">

                        </div>

                        <!-- MARCA -->

                        <div class="form-group">

                            <label for="marca">
                                Marca
                            </label>

                            <input 
                            type="text"
                            id="marca"
                            name="marca"
                            required
                            minlength="2"
                            maxlength="30">
                            
                        </div>

                        <!-- CATEGORIA -->

                        <div class="form-group">

                            <label for="categoria">
                                Categoría
                            </label>

                            <select id="categoria"
                                name="categoria"
                                required>

                                <option value="">
                                    Seleccionar categoría
                                </option>

                                <option value="cheesecakes">
                                    Cheesecakes
                                </option>

                                <option value="tartas">
                                    Tartas
                                </option>

                                <option value="tortas-basicas">
                                    Tortas básicas
                                </option>

                                <option value="tortas-modernas">
                                    Tortas modernas
                                </option>

                            </select>

                        </div>

                        <!-- DESCRIPCION CORTA -->

                        <div class="form-group">

                            <label for="descripcion-corta">
                                Descripción corta
                            </label>

                            <textarea 
                                id="descripcion-corta"
                                name="descripcion-corta"
                                placeholder="Breve descripción del producto..."
                                required
                                minlength="10"
                                maxlength="120"></textarea>

                        </div>

                        <!-- DESCRIPCION LARGA -->

                        <div class="form-group">

                            <label for="descripcion-larga">
                                Descripción larga
                            </label>

                            <textarea 
                                id="descripcion-larga"
                                name="descripcion-larga"
                                placeholder="Descripción completa del producto..."
                                required
                                minlength="20"
                                maxlength="500"></textarea>

                        </div>

                        <!-- ENVIO -->

                        <div class="form-group">

                            <label for="envio">
                                ¿Envío sin cargo?
                            </label>

                            <select 
                                id="envioSinCargo"
                                name="envioSinCargo"
                                required>

                                <option value="">
                                    Seleccionar opción
                                </option>

                                <option value="si">
                                    Sí
                                </option>

                                <option value="no">
                                    No
                                </option>

                            </select>

                        </div>

                        <!-- EDAD DESDE -->

                        <div class="form-group">

                            <label for="edad-desde">
                                Edad desde
                            </label>

                            <input 
                                type="number"
                                id="edad-desde"
                                name="edad-desde"
                                placeholder="0"
                                required
                                min="0"
                                max="99">

                        </div>

                        <!-- EDAD HASTA -->

                        <div class="form-group">

                            <label for="edad-hasta">
                                Edad hasta
                            </label>

                            <input 
                                type="number"
                                id="edad-hasta"
                                name="edad-hasta"
                                placeholder="99"
                                required
                                min="0"
                                max="99">

                        </div>

                        <!-- FOTO -->

                        <div class="form-group">

                            <label for="foto">
                                Foto del producto
                            </label>

                            <input type="url"
                                id="foto"
                                name="foto"
                                accept=".jpg, .jpeg, .png, .webp"
                                required>

                        </div>

                        <!-- BOTON -->

                        <button type="submit"
                            class="btn-enviar">

                            Agregar producto

                        </button>

                    </form>

                </div>

            </div>

        </section>
