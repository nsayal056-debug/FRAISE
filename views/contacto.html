 <section class="hero-contacto">

            <div class="hero-contacto-overlay">

                <div class="hero-contacto-content">

                    <h1>
                        Contactanos
                    </h1>

                    <p>
                        Estamos para ayudarte a crear momentos dulces e inolvidables ✨
                    </p>

                </div>

            </div>

        </section>

        <!-- FORMULARIO -->

        <section class="contacto-section">

            <div class="contacto-container">

                <!-- INFORMACION -->

                <div class="contacto-info">

                    <h2>
                        Información de contacto
                    </h2>

                    <p>
                        Podés escribirnos para consultas, pedidos personalizados o cualquier duda sobre nuestros productos.
                    </p>

                    <div class="contacto-datos">

                        <p>
                            <i class="fa-solid fa-location-dot"></i>
                            Arrecifes, Buenos Aires
                        </p>

                        <p>
                            <i class="fa-solid fa-phone"></i>
                            +54 9 2478 46-6498
                        </p>

                        <p>
                            <i class="fa-solid fa-envelope"></i>
                            fraisepasteleria69@gmail.com
                        </p>

                    </div>

                </div>

                <!-- FORM -->

                <div class="contacto-formulario">

                    <form id="form-contacto" novalidate>

                        <!-- NOMBRE -->

                        <div class="form-group">

                            <label for="nombre">
                                Nombre completo
                            </label>

                            <input type="text"
                                id="nombre"
                                name="nombre"
                                placeholder="Ingresá tu nombre"
                                required
                                minlength="3"
                                maxlength="40">

                        </div>

                        <!-- EMAIL -->

                        <div class="form-group">

                            <label for="email">
                                Correo electrónico
                            </label>

                            <input type="email"
                                id="email"
                                name="email"
                                placeholder="ejemplo@gmail.com"
                                required
                                minlength="5"
                                maxlength="50">

                        </div>

                        <!-- COMENTARIOS -->

                        <div class="form-group">

                            <label for="comentarios">
                                Comentarios
                            </label>

                            <textarea id="comentarios"
                                name="comentarios"
                                placeholder="Escribí tu mensaje..."
                                required
                                minlength="10"
                                maxlength="500"></textarea>

                        </div>

                        <!-- BOTON -->

                        <button type="submit" class="btn-enviar">
                            Enviar mensaje
                        </button>

                    </form>

                </div>

            </div>

        </section>
